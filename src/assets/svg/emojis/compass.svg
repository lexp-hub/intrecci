<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer brass/azure bezel -->
  <circle cx="24" cy="24" r="20" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
  <circle cx="24" cy="24" r="16.5" stroke="#BAE6FD" stroke-width="1.2"/>
  
  <!-- 4 Cardinal ticks -->
  <line x1="24" y1="5.5" x2="24" y2="9.5" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="38.5" x2="24" y2="42.5" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  <line x1="5.5" y1="24" x2="9.5" y2="24" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  <line x1="38.5" y1="24" x2="42.5" y2="24" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>

  <!-- North Needle (Red 3D Facets) -->
  <polygon points="24,8 29,24 24,24" fill="#EF4444"/>
  <polygon points="24,8 19,24 24,24" fill="#DC2626"/>

  <!-- South Needle (Silver 3D Facets) -->
  <polygon points="24,40 29,24 24,24" fill="#FFFFFF"/>
  <polygon points="24,40 19,24 24,24" fill="#CBD5E1"/>

  <!-- Needle outline -->
  <polygon points="24,8 29,24 24,40 19,24" stroke="#475569" stroke-width="1" stroke-linejoin="round"/>

  <!-- Center Brass Pivot Pin -->
  <circle cx="24" cy="24" r="3.5" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>
  <circle cx="23" cy="23" r="1" fill="#FFFFFF" opacity="0.8"/>
</svg>
